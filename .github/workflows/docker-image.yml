name: Docker Image CI

on:
  push:
    branches: [ "staging" ]
permissions:
  contents: read
  packages: write
  
env:
  IMAGE_TAG: ${{github.sha}}

jobs:

  stashd_app_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Log into GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: Build the Docker image of StashD App
      run: docker build ./app --file ./app/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://server:5000 --tag ghcr.io/sri-nivas1227/stashd-app:${{env.IMAGE_TAG}}
    - name: Push the built image to GitHub Container Registry
      run: docker push ghcr.io/sri-nivas1227/stashd-app:${{env.IMAGE_TAG}}
  stashd_server_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Log into GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: Build the Docker Image of StashD Flask Server
      run: docker build ./server --file ./server/Dockerfile --tag ghcr.io/sri-nivas1227/stashd-server:${{env.IMAGE_TAG}}
    - name: Push the built image to GitHub Container Registry
      run: docker push ghcr.io/sri-nivas1227/stashd-server:${{env.IMAGE_TAG}}
      
  stashd_deploy:
      needs: [stashd_app_build, stashd_server_build]
      runs-on: self-hosted
      permissions:
        contents: read
        packages: read
      concurrency:
        group: stashd-deploy
        cancel-in-progress: false
      steps:
        - name: Log into GHCR
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_USER: ${{ github.actor }}
          run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

        - name: Deploy, check health, roll back if broken
          env:
            NEW_TAG: ${{ env.IMAGE_TAG }}
          run: |
            cd ~/deployments/linkhub-deployment

            # 1. Remember what is running now, so we can go back to it
            PREV_TAG=$(grep '^STASHD_TAG=' .env | cut -d= -f2)
            echo "Previous version: $PREV_TAG"
            echo "New version:      $NEW_TAG"

            # 2. Point the compose file at the new version
            sed -i "s/^STASHD_TAG=.*/STASHD_TAG=$NEW_TAG/" .env

            # 3. Download the new images and start them
            healthy=false
            if docker compose pull && docker compose up -d; then

              # 4. Wait up to 3 minutes for both containers to report "healthy"
              for i in $(seq 1 36); do
                server=$(docker inspect --format '{{.State.Health.Status}}' server || echo missing)
                app=$(docker inspect --format '{{.State.Health.Status}}' linkhub || echo missing)
                echo "Check $i: server=$server app=$app"
                if [ "$server" = "healthy" ] && [ "$app" = "healthy" ]; then
                  healthy=true
                  break
                fi
                sleep 5
              done
            fi

            # 5. Decide: keep the new version or go back
            if [ "$healthy" = true ]; then
              echo "Deploy succeeded: $NEW_TAG is live."
            else
              echo "::error::Deploy of $NEW_TAG failed, rolling back to $PREV_TAG"
              docker compose logs --tail 40 server
              sed -i "s/^STASHD_TAG=.*/STASHD_TAG=$PREV_TAG/" .env
              docker compose up -d
              exit 1
            fi